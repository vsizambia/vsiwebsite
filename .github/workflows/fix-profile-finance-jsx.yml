name: Fix volunteer profile finance JSX
on:
  push:
    paths:
      - .github/workflows/fix-profile-finance-jsx.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix extra closing tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/volunteers/profile/[id]/page.js')
          s = p.read_text()
          old = '</table></div></div>{finance.donations.length>0'
          new = '</table></div>{finance.donations.length>0'
          if old not in s:
              raise SystemExit('Expected JSX pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'Visionary Students Initiative (VSI)'
          git config user.email 'vsizambia@gmail.com'
          git add 'app/admin/volunteers/profile/[id]/page.js'
          git commit -m 'fix: correct volunteer profile finance JSX' || exit 0
          git push
