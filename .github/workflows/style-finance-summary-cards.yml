name: Style volunteer finance summary cards
on:
  push:
    paths:
      - .github/workflows/style-finance-summary-cards.yml
jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Style finance cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/admin/volunteers/profile/[id]/page.js')
          s=p.read_text()
          old='''<div className={styles.hoursSummary} style={{marginTop:12,gridTemplateColumns:"repeat(3,minmax(0,1fr))"}}><div><span>MEMBERSHIP PAID</span><strong>ZMW {Number(finance.summary?.membership_paid||0).toLocaleString()}</strong></div><div><span>OUTSTANDING</span><strong>ZMW {Number(finance.summary?.outstanding||0).toLocaleString()}</strong></div><div><span>DONATIONS</span><strong>ZMW {Number(finance.summary?.donations_total||0).toLocaleString()}</strong></div></div>'''
          new='''<div className={styles.hoursSummary} style={{marginTop:12,padding:"0 28px 24px",display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:16}}><div style={{minHeight:112,padding:"20px 22px",borderRadius:16,display:"flex",flexDirection:"column",justifyContent:"space-between",boxSizing:"border-box",background:"#eef6ff",border:"1px solid #cfe3f8",boxShadow:"0 4px 14px rgba(15,76,129,.08)"}}><span style={{fontSize:".72rem",fontWeight:800,letterSpacing:".06em",color:"#35617f"}}>MEMBERSHIP PAID</span><strong style={{fontSize:"1.45rem",lineHeight:1.15,color:"#0b5ea8",marginTop:10}}>ZMW {Number(finance.summary?.membership_paid||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></div><div style={{minHeight:112,padding:"20px 22px",borderRadius:16,display:"flex",flexDirection:"column",justifyContent:"space-between",boxSizing:"border-box",background:"#f7f9fb",border:"1px solid #dfe6ed",boxShadow:"0 4px 14px rgba(15,76,129,.06)"}}><span style={{fontSize:".72rem",fontWeight:800,letterSpacing:".06em",color:"#52606d"}}>OUTSTANDING</span><strong style={{fontSize:"1.45rem",lineHeight:1.15,color:"#243b53",marginTop:10}}>ZMW {Number(finance.summary?.outstanding||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></div><div style={{minHeight:112,padding:"20px 22px",borderRadius:16,display:"flex",flexDirection:"column",justifyContent:"space-between",boxSizing:"border-box",background:"#fff8e6",border:"1px solid #f2dfaa",boxShadow:"0 4px 14px rgba(138,98,0,.07)"}}><span style={{fontSize:".72rem",fontWeight:800,letterSpacing:".06em",color:"#8a6200"}}>DONATIONS</span><strong style={{fontSize:"1.45rem",lineHeight:1.15,color:"#8a6200",marginTop:10}}>ZMW {Number(finance.summary?.donations_total||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></div></div>'''
          if old not in s:
              raise SystemExit('Expected finance summary block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Visionary Students Initiative (VSI)'
          git config user.email 'vsizambia@gmail.com'
          git add 'app/admin/volunteers/profile/[id]/page.js'
          git commit -m 'style: balance volunteer finance summary cards' || exit 0
          git push
