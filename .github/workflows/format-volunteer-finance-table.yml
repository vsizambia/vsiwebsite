name: Format volunteer finance table

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-table:
    if: github.event.head_commit.message != 'chore: mirror volunteer finance table styling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update volunteer profile finance table
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/admin/volunteers/profile/[id]/page.js')
          text = path.read_text()
          old = '''<div className={styles.tableWrap} style={{marginTop:18}}><table><thead><tr><th>Membership month</th><th>Due</th><th>Paid</th><th>Status</th></tr></thead><tbody>{finance.payments.length?finance.payments.slice(0,6).map(p=><tr key={p.id}><td>{String(p.payment_month).slice(0,7)}</td><td>ZMW {Number(p.amount_due||0).toLocaleString()}</td><td>ZMW {Number(p.amount_paid||0).toLocaleString()}</td><td>{p.status}</td></tr>):<tr><td colSpan="4">No membership payments recorded yet.</td></tr>}</tbody></table></div>'''
          new = '''<div className="financeProfileTable" style={{marginTop:18}}><table><thead><tr><th>Membership month</th><th>Due</th><th>Paid</th><th>Status</th></tr></thead><tbody>{finance.payments.length?finance.payments.slice(0,6).map((p,i)=><tr key={p.id} style={{background:i%2===1?"#fbfdff":"#fff"}}><td>{String(p.payment_month).slice(0,7)}</td><td>ZMW {Number(p.amount_due||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td>ZMW {Number(p.amount_paid||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td><span style={{display:"inline-flex",padding:"5px 9px",borderRadius:999,fontWeight:800,textTransform:"capitalize",background:String(p.status||"").toLowerCase()==="paid"?"#e8f6ee":(String(p.status||"").toLowerCase()==="unpaid"||String(p.status||"").toLowerCase()==="partial")?"#fff4d6":"#eef2f6",color:String(p.status||"").toLowerCase()==="paid"?"#18794e":(String(p.status||"").toLowerCase()==="unpaid"||String(p.status||"").toLowerCase()==="partial")?"#8a6200":"#52606d"}}>{p.status}</span></td></tr>):<tr><td colSpan="4">No membership payments recorded yet.</td></tr>}</tbody></table></div>'''
          if old not in text:
              raise SystemExit('Expected membership table markup was not found; no changes made.')
          text = text.replace(old, new, 1)

          style = '''<style>{`.financeProfileTable{padding:0 28px 28px;overflow-x:auto}.financeProfileTable table{width:100%;border-collapse:collapse}.financeProfileTable th,.financeProfileTable td{padding:12px 14px;text-align:left;vertical-align:top}.financeProfileTable thead{background:#0b5ea8;color:#fff}.financeProfileTable th{font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid #084b87}.financeProfileTable tbody tr:hover{background:#f4f9fc!important}@media(max-width:700px){.financeProfileTable{padding:0 18px 22px}.financeProfileTable th,.financeProfileTable td{padding:11px 10px}}`}</style>'''
          anchor = '<section className={styles.registerPanel} style={{marginTop:18}}><div className={styles.registerHeader}><div><p className="kicker">VOLUNTEER FINANCE</p>'
          if style not in text:
              text = text.replace(anchor, style + anchor, 1)
          path.write_text(text)
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/admin/volunteers/profile/[id]/page.js' '.github/workflows/format-volunteer-finance-table.yml'
          git commit -m 'style: mirror volunteer finance history table' || exit 0
          git rm '.github/workflows/format-volunteer-finance-table.yml'
          git commit -m 'chore: remove temporary formatting workflow'
          git push
