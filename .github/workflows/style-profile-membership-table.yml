name: Style volunteer profile membership table
on:
  push:
    paths:
      - .github/workflows/style-profile-membership-table.yml
jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply table-only styling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/admin/volunteers/profile/[id]/page.js')
          s = path.read_text()
          start_marker = '<div className={styles.tableWrap} style={{marginTop:18}}><table><thead><tr><th>Membership month</th>'
          end_marker = '</div>{finance.donations.length>0'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          new = '''<div className="financeProfileTable" style={{marginTop:18,padding:"0 28px 28px",overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr style={{background:"#0b5ea8",color:"#fff"}}><th style={{padding:"12px 14px",textAlign:"left",fontSize:".78rem",fontWeight:800,letterSpacing:".04em",textTransform:"uppercase",borderBottom:"2px solid #084b87"}}>Membership month</th><th style={{padding:"12px 14px",textAlign:"left",fontSize:".78rem",fontWeight:800,letterSpacing:".04em",textTransform:"uppercase",borderBottom:"2px solid #084b87"}}>Due</th><th style={{padding:"12px 14px",textAlign:"left",fontSize:".78rem",fontWeight:800,letterSpacing:".04em",textTransform:"uppercase",borderBottom:"2px solid #084b87"}}>Paid</th><th style={{padding:"12px 14px",textAlign:"left",fontSize:".78rem",fontWeight:800,letterSpacing:".04em",textTransform:"uppercase",borderBottom:"2px solid #084b87"}}>Status</th></tr></thead><tbody>{finance.payments.length?finance.payments.slice(0,6).map((p,i)=>{const status=String(p.status||"").toLowerCase();return <tr key={p.id} style={{background:i%2===1?"#fbfdff":"#fff"}}><td style={{padding:"12px 14px",color:"#334e68",borderBottom:"1px solid #e8edf2"}}>{String(p.payment_month).slice(0,7)}</td><td style={{padding:"12px 14px",color:"#334e68",borderBottom:"1px solid #e8edf2"}}>ZMW {Number(p.amount_due||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td style={{padding:"12px 14px",color:"#334e68",borderBottom:"1px solid #e8edf2"}}>ZMW {Number(p.amount_paid||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td style={{padding:"12px 14px",borderBottom:"1px solid #e8edf2"}}><span style={{display:"inline-flex",padding:"5px 9px",borderRadius:999,fontWeight:800,textTransform:"capitalize",background:status==="paid"?"#e8f6ee":(status==="unpaid"||status==="partial")?"#fff4d6":"#eef2f6",color:status==="paid"?"#18794e":(status==="unpaid"||status==="partial")?"#8a6200":"#52606d"}}>{p.status}</span></td></tr>}) : <tr><td colSpan="4" style={{padding:"14px",color:"#52606d"}}>No membership payments recorded yet.</td></tr>}</tbody></table></div>'''
          path.write_text(s[:start] + new + s[end:])
          PY
          git config user.name 'Visionary Students Initiative (VSI)'
          git config user.email 'vsizambia@gmail.com'
          git add 'app/admin/volunteers/profile/[id]/page.js'
          git commit -m 'style: mirror volunteer membership history table' || exit 0
          git push
